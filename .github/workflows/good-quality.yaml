name: Good quality
run-name: ${{ github.actor }} is checking good quality 🔎
on:
  pull_request:
    branches:
      - main
jobs:
name: Example

jobs:
  uv-example:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --all-extras --dev
        shell: bash

      - name: Run unit test
        run: uv run pytest
        shell: bash

