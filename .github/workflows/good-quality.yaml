name: Good quality
run-name: ${{ github.actor }} is checking good quality 🔎
on: [push, pull_request]

  #push:
    #branches:
      #- main
  #pull_request:
    #branches:
      #- main

jobs:
  uv-checking-good-quality:
    name: good-quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --all-extras --dev
        shell: bash

      - name: check-linter
        run: uv run ruff check .
        shell: bash

      - name: check-formatter
        run: uv run ruff format --check .
        shell: bash

      - name: check-type-safety
        run: uv run pyright
        shell: bash

      - name: run-unit-test
        run: uv run pytest
        shell: bash