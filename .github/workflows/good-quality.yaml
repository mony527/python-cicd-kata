name: Good quality
run-name: ${{ github.actor }} is checking good quality 🔎
on: [push, pull_request]

  #push:
    #branches:
      #- main
  #pull_request:
    #branches:
      #- main

jobs:

  check-linter:
    uses: ./.github/workflows/set-up.yaml
    name: check-linter
    runs-on: ubuntu-latest

    steps:
      - name: check-linter
        run: uv run ruff check .
        shell: bash

  check-formatter:
    uses: ./.github/workflows/set-up.yaml
    name: check-formatter
    runs-on: ubuntu-latest

    steps:
      - name: check-formatter
        run: uv run ruff format --check .
        shell: bash

  check-type-safety:
    uses: ./.github/workflows/set-up.yaml
    name: check-formatter
    runs-on: ubuntu-latest

    steps:
      - name: check-type-safety
        run: uv run pyright
        shell: bash

  run-unit-test:
    uses: ./.github/workflows/set-up.yaml
    name: run-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: run-unit-test
        run: uv run pytest
        shell: bash